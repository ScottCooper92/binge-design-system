name: CI

# The gate for this repository, and the trigger for every bot in this directory:
# bot-review fires on a successful run of this workflow, author-ci-fix on a failed
# one, and author-conflicts on one completing against main. They match it by NAME,
# so renaming this workflow silently unhooks all three.
#
# Three jobs make up the gate, with `build` as the one required check. `check` runs
# `./gradlew build`, which is the Kotlin compile, the unit tests, ktlintCheck and Android lint, because
# the ktlint plugin and AGP both wire themselves into `check` and `build` depends on `check`. The
# screenshot suite is named on top of it: the screenshot plugin does not hook `check`, and a component
# library whose only visible contract is how it renders needs the baselines compared on every run.
# `screenshots` runs that suite in SHARDS of the same classes, because one JVM took about 11 minutes
# and sometimes reached the 30-minute timeout, which shows as a cancelled run that needs a re-run by
# hand. `build` is the summary: it needs both, fails unless both succeeded, and keeps the job id and
# name `build`, so the required status check is unchanged and branch protection needs no edit. The
# split buys wall time, not a second check to keep in sync, because only `build` is required.
#
# Deliberately NO paths-ignore, matching binge-companions. bot-review requires a
# SUCCESSFUL run of this workflow against the head, so a skipped run means a PR that
# is never reviewed. .ai/ holds the rules the bots themselves read, so a docs filter
# would bypass review on exactly the changes that most need it.
on:
  push:
    branches: [main]
  pull_request:
    # `ready_for_review` is not in the default set, and without it a PR opened as a
    # draft and later promoted never gets a first run — so bot-review, which only
    # fires on a run of this workflow completing, never sees it either.
    types: [opened, synchronize, reopened, ready_for_review]
  # A canary for what can turn the screenshot gate red with no commit here: a runner image
  # or Android SDK update, a rendering-toolchain drift. Without it the next PR to run takes
  # the blame. It builds main, and the three bots skip it (see their `if:`) because there
  # is no PR for them to act on. Scheduled workflows only run on the default branch.
  schedule:
    - cron: '0 4 * * *'

# Per-ref group: a new commit on the same branch/PR cancels its superseded run. The event
# name keeps the nightly run, which shares main's ref, from cancelling or being cancelled
# by a push.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Compile, unit tests, ktlint and Android lint. Everything but the screenshot comparison.
  check:
    # Skip while a PR is a draft, so a stack can be opened as drafts and promoted one
    # at a time without each queued run preempting the last. Push events to main always
    # run — `pull_request` is null there. A draft therefore reports conclusion
    # "skipped", which author-ci-fix and bot-review both already treat as "not green".
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # Generous against a build that currently takes a couple of minutes, so it catches
    # a hang rather than a slow day. The Android SDK is preinstalled on the runner
    # image; nothing here installs one.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # JDK 21, as in the other repositories. The JDK only runs the build: jvmTarget
      # stays 17, so nothing that ships changes.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-cleanup: on-success

      # gradle.properties turns the configuration cache on, but Gradle stores it under
      # <project>/.gradle/configuration-cache, outside the Gradle User Home that setup-gradle
      # restores, and a hosted runner starts every job from an empty disk. Without this step
      # every run logs "Calculating task graph as no cached configuration is available" and
      # pays to write an entry nothing reads back. The key is what invalidates an entry (the
      # wrapper, build scripts, catalog and properties); Gradle still validates whatever it
      # restores, so a near-miss from restore-keys is discarded rather than trusted.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .gradle/configuration-cache
          key: gradle-config-cache-check-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts', 'libs.versions.toml', 'gradle.properties') }}
          restore-keys: gradle-config-cache-check-${{ runner.os }}-

      # --continue surfaces every failure in one run rather than stopping at the first,
      # which matters most to author-ci-fix: it gets exactly one repair attempt per
      # commit, and a log showing only the first of three failures spends that attempt
      # fixing a third of the problem.
      - name: Build, test and lint
        run: ./gradlew build --continue

      # Reports for triaging a red run. Listed explicitly rather than globbing
      # **/build/reports/ — the greedy glob is fail-OPEN, so every new report type
      # Gradle and AGP invent silently reappears in the artifact. Both the test reports
      # and the lint results are named, because a red run here is as likely to be lint
      # as it is to be a failing test, and author-ci-fix triages from what it can read.
      - name: Upload reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: build-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-*.html
            **/build/reports/ktlint/**
          if-no-files-found: ignore
          retention-days: ${{ github.event_name == 'schedule' && 7 || 1 }}

  # The screenshot comparison, in SHARDS. scripts/screenshot-shard.sh gives shard N every third
  # `@PreviewTest` class by sorted name, the same selection for validate and for a local
  # update, so each class is compared exactly once. `fail-fast: false` lets every shard finish
  # and report its own diffs, because a repair attempt needs all of them, not the first.
  screenshots:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-cleanup: on-success

      # Its own key per shard: the entry depends on the tasks asked for, and every shard asks for
      # different ones, so sharing one key would have three jobs racing to save different entries.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .gradle/configuration-cache
          key: gradle-config-cache-screenshots-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts', 'libs.versions.toml', 'gradle.properties') }}
          restore-keys: gradle-config-cache-screenshots-${{ matrix.shard }}-${{ runner.os }}-

      - name: Validate screenshots (shard ${{ matrix.shard }} of 3)
        run: |
          args="$(scripts/screenshot-shard.sh validate "${{ matrix.shard }}" 3)"
          if [ -z "$args" ]; then
            echo "Shard ${{ matrix.shard }} has no screenshot classes."
            exit 0
          fi
          # Word splitting is the point: the script prints one argument list.
          # shellcheck disable=SC2086
          ./gradlew $args --continue

      # Only the diff images, not the HTML screenshot report: that report inlines the
      # reference, actual and diff of every frame as base64 and reached ~485 MB in Binge.
      # The references are committed and the actual render is one updateDebugScreenshotTest
      # away. An empty match means the failure was not a comparison mismatch, so ignore it
      # rather than fail the upload and hide the real error. One artifact per shard, because an
      # artifact name cannot be shared across jobs; `build` merges them back into `screenshot-diffs`.
      - name: Upload screenshot diffs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: screenshot-diffs-${{ matrix.shard }}
          path: '**/build/outputs/screenshotTest-results/**/diffs/**'
          if-no-files-found: ignore
          retention-days: ${{ github.event_name == 'schedule' && 7 || 1 }}

  # The required check, with the id and name it has always had: `build`. It runs no build of its
  # own. It is red unless `check` and every shard succeeded, and skipped for a draft, as the job
  # it replaces was. `!cancelled()` is what makes it report when a shard fails, instead of being
  # skipped with its needs, while a run superseded by a newer push, which GitHub cancels, runs
  # nothing here: `always()` would run it after the cancel and report a red `build` on a commit nobody is waiting on.
  build:
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    needs: [check, screenshots]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every part to have succeeded
        env:
          CHECK: ${{ needs.check.result }}
          SCREENSHOTS: ${{ needs.screenshots.result }}
        run: |
          echo "check: $CHECK"
          echo "screenshots: $SCREENSHOTS"
          if [ "$CHECK" != "success" ] || [ "$SCREENSHOTS" != "success" ]; then
            echo "A part of the build did not succeed." >&2
            exit 1
          fi

      # The shards' diffs under the one name they had before sharding, for whatever reads it. Only
      # when a shard failed; with no diff artifact to merge, there is nothing to do.
      - name: Merge screenshot diffs
        if: ${{ !cancelled() && needs.screenshots.result == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact/merge@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: screenshot-diffs
          pattern: screenshot-diffs-*
          delete-merged: true
          retention-days: ${{ github.event_name == 'schedule' && 7 || 1 }}

  # The caller files here are thin shims, where a mistake can become a silent startup_failure
  # with no log and nothing on the PR. Kept inside this workflow, not a workflow of its own: a
  # second required check would need keeping in sync with branch protection, and the bots
  # match this workflow by name. actionlint cannot see across a `uses:` reference to a reusable
  # workflow, so the callers' permissions are still proved by running them.
  actionlint:
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # binge-ci's shared step: a pinned actionlint release verified against its published checksum,
      # with shellcheck at warning severity.
      - uses: ScottCooper92/binge-ci/.github/actions/actionlint@c34892a468b77ebc2f92ef7ec716e27ad5c50d69 # v1.0.50

  # A red nightly has no PR or push to carry it, so without this it is a red mark in the
  # Actions tab that nothing points at. One issue stays open while the canary is red and
  # closes itself on the next green run, so an open one means "still broken", not "old".
  # Anything but success reports: a job that hits its timeout is `cancelled`, not `failure`, and the
  # nightly has its own concurrency group, so nothing else supersedes it.
  nightly-report:
    if: ${{ always() && github.event_name == 'schedule' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: ScottCooper92/binge-ci/.github/actions/nightly-report@c34892a468b77ebc2f92ef7ec716e27ad5c50d69 # v1.0.50
        with:
          result: ${{ needs.build.result }}
          title: Nightly CI is failing on main
          note: >-
            Nothing was pushed to cause this, so suspect the environment first: a runner image or
            Android SDK update, or drift in the screenshot renderer. The build-reports artifact is
            kept for seven days.
