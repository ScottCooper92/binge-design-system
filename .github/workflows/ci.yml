name: CI

# The gate for this repository, and the trigger for every bot in this directory:
# bot-review fires on a successful run of this workflow, author-ci-fix on a failed
# one, and author-conflicts on one completing against main. They match it by NAME,
# so renaming this workflow silently unhooks all three.
#
# One job, deliberately. `./gradlew build` already runs the Kotlin compile, the unit
# tests, ktlintCheck and Android lint, because the ktlint plugin and AGP both wire
# themselves into `check` and `build` depends on `check`. The screenshot suite is the
# one task named on top of it: the screenshot plugin does not hook `check`, and a
# component library whose only visible contract is how it renders needs the baselines
# compared on every run. Splitting into separate jobs would buy parallelism this build
# is far too small to need, and would cost a second required status check to keep in
# sync with branch protection.
#
# Deliberately NO paths-ignore, matching binge-companions. bot-review requires a
# SUCCESSFUL run of this workflow against the head, so a skipped run means a PR that
# is never reviewed. .ai/ holds the rules the bots themselves read, so a docs filter
# would bypass review on exactly the changes that most need it.
on:
  push:
    branches: [main]
  pull_request:
    # `ready_for_review` is not in the default set, and without it a PR opened as a
    # draft and later promoted never gets a first run — so bot-review, which only
    # fires on a run of this workflow completing, never sees it either.
    types: [opened, synchronize, reopened, ready_for_review]
  # A canary for what can turn the screenshot gate red with no commit here: a runner image
  # or Android SDK update, a rendering-toolchain drift. Without it the next PR to run takes
  # the blame. It builds main, and the three bots skip it (see their `if:`) because there
  # is no PR for them to act on. Scheduled workflows only run on the default branch.
  schedule:
    - cron: '0 4 * * *'

# Per-ref group: a new commit on the same branch/PR cancels its superseded run. The event
# name keeps the nightly run, which shares main's ref, from cancelling or being cancelled
# by a push.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Skip while a PR is a draft, so a stack can be opened as drafts and promoted one
    # at a time without each queued run preempting the last. Push events to main always
    # run — `pull_request` is null there. A draft therefore reports conclusion
    # "skipped", which author-ci-fix and bot-review both already treat as "not green".
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # Generous against a build that currently takes a couple of minutes, so it catches
    # a hang rather than a slow day. The Android SDK is preinstalled on the runner
    # image; nothing here installs one.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # JDK 17, matching Binge rather than binge-companions' 21. The extracted code
      # targets jvmTarget 17 and the AGP in libs.versions.toml is what Binge builds with, so the toolchain
      # here is the one the carve arrives expecting.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      # gradle.properties turns the configuration cache on, but Gradle stores it under
      # <project>/.gradle/configuration-cache, outside the Gradle User Home that setup-gradle
      # restores, and a hosted runner starts every job from an empty disk. Without this step
      # every run logs "Calculating task graph as no cached configuration is available" and
      # pays to write an entry nothing reads back. The key is what invalidates an entry (the
      # wrapper, build scripts, catalog and properties); Gradle still validates whatever it
      # restores, so a near-miss from restore-keys is discarded rather than trusted.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .gradle/configuration-cache
          key: gradle-config-cache-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts', 'libs.versions.toml', 'gradle.properties') }}
          restore-keys: gradle-config-cache-${{ runner.os }}-

      # --continue surfaces every failure in one run rather than stopping at the first,
      # which matters most to author-ci-fix: it gets exactly one repair attempt per
      # commit, and a log showing only the first of three failures spends that attempt
      # fixing a third of the problem.
      - name: Build, test, lint and validate screenshots
        run: ./gradlew build validateDebugScreenshotTest --continue

      # Reports for triaging a red run. Listed explicitly rather than globbing
      # **/build/reports/ — the greedy glob is fail-OPEN, so every new report type
      # Gradle and AGP invent silently reappears in the artifact. Both the test reports
      # and the lint results are named, because a red run here is as likely to be lint
      # as it is to be a failing test, and author-ci-fix triages from what it can read.
      - name: Upload reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-*.html
            **/build/reports/ktlint/**
          if-no-files-found: ignore
          retention-days: ${{ github.event_name == 'schedule' && 7 || 1 }}

      # Only the diff images, not the HTML screenshot report: that report inlines the
      # reference, actual and diff of every frame as base64 and reached ~485 MB in Binge.
      # The references are committed and the actual render is one updateDebugScreenshotTest
      # away. An empty match means the failure was not a comparison mismatch, so ignore it
      # rather than fail the upload and hide the real error.
      - name: Upload screenshot diffs
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: screenshot-diffs
          path: '**/build/outputs/screenshotTest-results/**/diffs/**'
          if-no-files-found: ignore
          retention-days: ${{ github.event_name == 'schedule' && 7 || 1 }}

  # The caller files here are thin shims, where a mistake can become a silent startup_failure
  # with no log and nothing on the PR. Kept inside this workflow, not a workflow of its own: a
  # second required check would need keeping in sync with branch protection, and the bots
  # match this workflow by name. actionlint cannot see across a `uses:` reference to a reusable
  # workflow, so the callers' permissions are still proved by running them.
  actionlint:
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      # Same invocation as binge-ci's own CI: a pinned release verified against its published
      # checksum. --severity=warning, not the default, because info fires SC2016 on single-quoted
      # scripts where the quotes are correct.
      - name: actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          curl -sSLo actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
          ./actionlint -shellcheck 'shellcheck --severity=warning'

  # A red nightly has no PR or push to carry it, so without this it is a red mark in the
  # Actions tab that nothing points at. One issue stays open while the canary is red and
  # closes itself on the next green run, so an open one means "still broken", not "old".
  # Anything but success reports: a job that hits its timeout is `cancelled`, not `failure`, and the
  # nightly has its own concurrency group, so nothing else supersedes it.
  nightly-report:
    if: ${{ always() && github.event_name == 'schedule' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        with:
          script: |
            const title = 'Nightly CI is failing on main';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { owner, repo } = context.repo;
            const open = (await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            })).find((i) => !i.pull_request && i.title === title);

            if (process.env.BUILD_RESULT === 'success') {
              if (!open) return;
              await github.rest.issues.createComment({
                owner, repo, issue_number: open.number,
                body: `The nightly run is green again: ${runUrl}`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: open.number, state: 'closed', state_reason: 'completed',
              });
            } else {
              if (open) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: open.number,
                  body: `Still failing: ${runUrl}`,
                });
                return;
              }
              await github.rest.issues.create({
                owner, repo, title,
                body: [
                  `The scheduled run of CI failed: ${runUrl}`,
                  '',
                  'Nothing was pushed to cause this, so suspect the environment first: a runner image or Android SDK update, or drift in the screenshot renderer. The build-reports artifact is kept for seven days.',
                  '',
                  'This issue closes itself on the next green nightly run.',
                ].join('\n'),
              });
            }
