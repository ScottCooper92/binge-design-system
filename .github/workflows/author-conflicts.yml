name: Author - resolve merge conflicts

# What set this run off. This one sweeps every conflicted PR rather than acting on one, so it is
# named for the branch whose CI finished - a PR number here would name whichever PR happened to be
# first in the matrix. Without it, a workflow_run run reads as the default branch every time.
run-name: >-
  ${{ github.event.workflow_run.head_branch
        && format('sweep after {0}', github.event.workflow_run.head_branch)
      || 'sweep · dispatched' }}

# Thin caller. The workflow itself lives in ScottCooper92/binge-ci.
#
# PUBLIC repository: the fork filter inside the scan is the control here, not a
# formality. The `agent` label stays maintainers-only.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

jobs:
  resolve:
    # Skip the scheduled canary run of CI: it has no PR to review, fix or rebase.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event != 'schedule'
    uses: ScottCooper92/binge-ci/.github/workflows/author-conflicts.yml@v1
    with:
      dispatched: ${{ github.event_name == 'workflow_dispatch' }}
      author_bot_id: ${{ vars.AUTHOR_BOT_ID }}
      conflict_rules: |
        This repository has no baseline files and no suppression lists, so
        there is nothing here of the kind that must keep both sides
        mechanically. Two kinds of conflict are still never yours to
        arbitrate.

        A conflict in a screenshot baseline PNG under
        `src/screenshotTestDebug/reference/` cannot be merged at all: picking
        a side means choosing which rendering is correct, which is a human's
        call. Leave it unresolved and say so in note.md rather than guessing.

        A conflict over a public signature of a component must be handed
        back. This build is included by Binge and by binge-seerr, and you
        cannot compile either from here, and CI compiles only binge-seerr, so
        you cannot tell whether a resolution that compiles in this repository
        breaks a consumer. Leave
        it unresolved and say so in note.md.
    secrets:
      AUTHOR_APP_ID: ${{ secrets.AUTHOR_APP_ID }}
      AUTHOR_APP_PRIVATE_KEY: ${{ secrets.AUTHOR_APP_PRIVATE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
