name: Consumer check (binge-seerr)

# Informational. Builds binge-seerr, a public consumer of this repository, against this PR's
# head commit, because a green build here says nothing about a consumer: a changed public
# signature is only noticed by the bump PR that arrives after it merged.
#
# Deliberately NOT named `CI`. bot-review, author-ci-fix and author-conflicts match that name,
# and this check can go red for a reason that has nothing to do with the diff being reviewed,
# or for exactly the reason an intentional signature change should. Keep it out of branch
# protection too. The PR-body obligation to say what a change means for the consumers stays;
# this supplies the evidence.
#
# Informational is not the same as no effect on merging. bot-review's auto-merge reads the PR's
# merge state, and a failing or still-running check here holds it at UNSTABLE, so the bot holds
# the merge of an approved PR and names this check. That includes an intentional signature
# change. A maintainer then merges by hand, or re-runs CI once this job is green.
#
# Binge is the other consumer and is private, so it needs a token and is not covered here.
#
# It compiles the consumer's main and unit-test sources and nothing else: that is what catches a
# changed public signature. The consumer's lint, unit tests and screenshot baselines say little
# about this change, and made the job take over twenty minutes. A design change that moves
# pixels moves the consumer's baselines by intent, so that part is reported by the consumer's
# own bump PR. It also runs on pushes to main, which is what writes the Gradle cache:
# setup-gradle only saves on the default branch, so a job that ran on pull requests alone would
# start cold every time. It runs only when something the consumer compiles can have changed.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'designsystem/**'
      - 'designsystem-tv/**'
      - 'libs.versions.toml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/consumer-check.yml'
  push:
    branches: [main]
    paths:
      - 'designsystem/**'
      - 'designsystem-tv/**'
      - 'libs.versions.toml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/consumer-check.yml'

concurrency:
  group: consumer-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  seerr:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # binge-seerr includes `binge-companions` and `design-system` as submodule composite
      # builds (its settings.gradle.kts), so both must exist before Gradle evaluates settings.
      - name: Check out binge-seerr
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ScottCooper92/binge-seerr
          ref: main
          submodules: true

      # Swap the consumer's pinned design-system for this PR's candidate commit. The
      # directory name is what its `includeBuild("design-system")` resolves.
      - name: Replace design-system with this PR
        run: rm -rf design-system

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: design-system
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Compile binge-seerr against this change
        run: ./gradlew :app:compileDebugKotlin :app:compileDebugUnitTestKotlin --continue

      - name: Report
        if: ${{ always() }}
        env:
          OUTCOME: ${{ job.status }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          {
            echo "## binge-seerr against this change (${SHA})"
            echo
            echo "Informational only. This is not a required check."
            echo
            echo "Compiled the consumer's main and unit-test sources. Lint, unit tests and screenshot baselines are not run here."
            echo
            if [ "${OUTCOME}" = "success" ]; then
              echo "binge-seerr still compiles against this change."
            else
              echo "The consumer no longer compiles against this change. Its bump PR will need code changes. Expected for an intentional signature change; say so in the PR body."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
