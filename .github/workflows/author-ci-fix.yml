name: Author - fix failing CI

# Which PR this run is for. A workflow_run run is attributed to the default branch, so without
# this every run of this workflow carries the same branch and the same title, and telling two
# apart means opening one. run-name is evaluated before any job, so it cannot use the number the
# called workflow resolves - it comes off the event, and falls back to the head branch, which is
# what that resolution looks the PR up by anyway.
run-name: >-
  ${{ github.event.workflow_run.pull_requests[0].number
        && format('#{0} · {1}', github.event.workflow_run.pull_requests[0].number, github.event.workflow_run.head_branch)
      || github.event.workflow_run.head_branch
      || github.ref_name }}

# Thin caller. The workflow itself lives in ScottCooper92/binge-ci.
#
# `CI` is matched by NAME - renaming ci.yml's `name:` silently unhooks this, bot-review
# and author-conflicts all at once.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

# A reusable workflow cannot be granted MORE than its caller holds, and a caller with no
# `permissions:` block gets the repository default - which is `contents: read` and does NOT
# include `actions`. The called workflow needs `actions: read` for its CI-run lookup, so without
# this the run dies as `startup_failure` before a single step executes: no log, no annotation, and
# nothing on the PR.
#
# This is the one way a reusable workflow differs from the copy it replaced. An ordinary workflow
# declaring `permissions: actions: read` simply gets it; a caller has to hold it first. Found by
# running it (binge-seerr#1), not by actionlint, which has no way to see across the reference.
permissions:
  contents: read
  actions: read

jobs:
  fix:
    # Skip the scheduled canary run of CI: it has no PR to review, fix or rebase.
    #
    # A fork PR never reaches the bot. binge-ci refuses one too, and this keeps the guard in sight
    # here (#407). It checks the events that name a head repository and lets the others through.
    if: >-
      (github.event.workflow_run.event != 'schedule') &&
      (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) &&
      (!github.event.workflow_run || github.event.workflow_run.head_repository.full_name == github.repository)
    uses: ScottCooper92/binge-ci/.github/workflows/author-ci-fix.yml@bd0ca952ab5ea6c5d6d6f4eda140848438d89cb4 # v1.0.60
    with:
      author_bot_id: ${{ vars.AUTHOR_BOT_ID }}
      # jvm, not android: this repo's ci.yml is setup-java + setup-gradle and nothing
      # else. ci-setup is Binge's bootstrap - it writes a local.properties carrying a
      # TMDB key this build has no use for, and tunes Gradle for a container this job
      # does not run in. The Android SDK is preinstalled on the hosted runner image.
      toolchain: jvm
      java_version: '21'
      # Scott, 2026-11-18: the bot may re-record frames of components its own PR changed, with
      # before/after posted for review (binge-ci #376).
      rerecord_screenshots: true
      verify_guidance: >
        Scope Gradle to the module rather than running the whole tree when you
        are checking one thing — `./gradlew :designsystem:test`, or
        `:designsystem:ktlintCheck`. Do not run `./gradlew build`; CI will do that
        when you push.

        You cannot compile the consumers from here. This build is included by Binge,
        binge-seerr, binge-archive and ephyra, so a change that is green here can still break
        theirs. CI compiles binge-seerr, binge-archive and ephyra informationally; Binge is
        not compiled. If a fix
        changes a public signature, say so rather than assuming green means safe.
      gate_rules: |
        NEVER silence a gate instead of fixing it. Do not add a ktlint
        baseline, do not add `ktlint-disable` comments to make a file pass,
        do not add a lint-baseline.xml, do not set `abortOnError = false`,
        and do not exclude a source set from `check`.

        Screenshot baselines follow the re-record gate this workflow turns
        on (rerecord_screenshots): re-record a frame only when every differing
        frame renders a component this PR's own diff changed, run the update
        task scoped to those classes, and commit only those PNGs. The workflow
        then posts each frame's before and after on the PR for the review bot
        to judge against the PR's stated intent. A differing frame for a
        component the PR did not touch is a regression or a stale base: stop
        and say so, because that change lands in four other codebases that
        never agreed to it. A render error or an out-of-memory failure is not
        a diff: never re-record on one. Never delete a baseline to get green.

        Formatting failures are the cheapest class of failure to fix
        properly. A lint baseline is worse than it looks: it silences the
        finding permanently and silently, in a repository whose whole purpose
        is to be included by other builds. A baseline here is a finding
        suppressed in four codebases that never agreed to it.

        If the only way to green is through one of the suppressions above,
        or through a frame the PR did not change, that is a stop: make no
        changes and say so.
    secrets:
      AUTHOR_APP_ID: ${{ secrets.AUTHOR_APP_ID }}
      AUTHOR_APP_PRIVATE_KEY: ${{ secrets.AUTHOR_APP_PRIVATE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
