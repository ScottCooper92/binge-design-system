# Daemon heap sized for AGP plus the screenshot renderer's classloading; the forked render/validate
# JVMs are sized separately below.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official

# Compose Preview Screenshot Testing. The flag is what makes AGP create the screenshotTest source
# set; the heap override is the plugin's own knob for the forked render and validate JVMs, which
# otherwise get Gradle's 512m default and die inside layoutlib. Both match Binge, where the
# baselines this repository carries were first recorded.
android.experimental.enableScreenshotTest=true
android.compose.screenshot.maxHeapSize=2g
